name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test

  php74-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Lint every shipped PHP file under the 7.4 floor
        run: |
          set -e
          shopt -s nullglob
          files=( marginal-core.php inc/*.php modules/*.php )
          for file in "${files[@]}"; do
            php -l "$file"
          done
